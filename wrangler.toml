# Cloudflare Workers（静的アセット同梱）の設定
#
#   /            -> index.html        （静的ファイルが優先される）
#   /fighters.js -> fighters.js
#   /log /meta /icon /history /rate   （該当ファイルが無いので Worker が処理）
#
# GitHub の main に push すると Workers Builds が自動でデプロイする。

name = "smash-logger-app"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"

# リポジトリのルートをそのまま公開する。除外は .assetsignore を見る。
[assets]
directory = "."

[vars]
# 移行中は旧フロント（GitHub Pages）も動くようにしておく。
# 新URLに一本化したら、このURLを新しいものへ書き換える。
ALLOWED_ORIGIN = "https://pzeo581e-max.github.io"

MATCH_DB_ID = "df7dde8c-0b99-466d-aefe-e3779f4b06a1"  # 🎮 スマブラ対戦記録
MEMO_DB_ID  = "869c23c7-0b13-4a77-9e37-b11b040ebab9"  # 🗒 スマブラメモ

# NOTION_TOKEN と APP_TOKEN は Secret。ダッシュボードで登録する（ここには書かない）。
