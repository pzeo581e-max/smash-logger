<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スマブラ 記録</title>
<style>
  :root{
    --bg:#191919; --panel:#252525; --panel2:#2f2f2f; --line:#3a3a3a;
    --tx:#eaeaea; --tx2:#9b9b9b; --accent:#2383e2; --win:#2f9e63; --lose:#d4453f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:15px;margin:0;font-weight:600;flex:1}
  .tabs{display:flex;gap:4px;background:var(--panel);border-radius:8px;padding:3px}
  .tabs button{background:none;border:0;color:var(--tx2);padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer}
  .tabs button.on{background:var(--panel2);color:var(--tx)}
  .icon-btn{background:none;border:0;color:var(--tx2);font-size:18px;cursor:pointer;padding:4px}
  main{padding:14px;max-width:820px;margin:0 auto;padding-bottom:120px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .label{font-size:12px;color:var(--tx2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .label .pick{color:var(--accent);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;
    max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .grid.open{max-height:none}
  .tile{background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:8px 4px;
    font-size:11.5px;line-height:1.25;text-align:center;cursor:pointer;color:var(--tx);
    min-height:44px;display:flex;align-items:center;justify-content:center;word-break:break-all}
  .tile img{width:32px;height:32px;display:block;margin:0 auto 2px}
  .tile.sel{border-color:var(--accent);background:#1f3b57}
  input[type=text],input[type=date],input[type=url],input[type=password],textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--tx);padding:10px;font-size:15px;font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  .search{margin-bottom:8px}
  .wl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .wl button{padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--tx);font-size:16px;font-weight:600;cursor:pointer}
  .wl button.w.on{background:var(--win);border-color:var(--win)}
  .wl button.l.on{background:var(--lose);border-color:var(--lose)}
  .send{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .send button{width:100%;max-width:792px;margin:0 auto;display:block;padding:15px;border:0;border-radius:10px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .send button:disabled{opacity:.45}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#111;border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .log{font-size:12px;color:var(--tx2);line-height:1.7}
  .hide{display:none}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>🎮 スマブラ 記録</h1>
  <div class="tabs">
    <button id="tab-match" class="on">対戦</button>
    <button id="tab-memo">メモ</button>
  </div>
  <button class="icon-btn" id="gear" title="設定">⚙</button>
</header>

<main>
  <!-- 設定 -->
  <section id="view-cfg" class="hide">
    <div class="card">
      <div class="label">Cloudflare Worker の URL</div>
      <input type="url" id="cfg-url" placeholder="https://smash-logger.xxxx.workers.dev">
      <div class="label" style="margin-top:12px">合言葉（APP_TOKEN）</div>
      <input type="password" id="cfg-token" placeholder="Workerに設定したトークン">
      <div class="label" style="margin-top:12px">この端末にのみ保存されます（localStorage）。</div>
    </div>
  </section>

  <!-- 対戦記録 -->
  <section id="view-match">
    <div class="card">
      <div class="label">自分のファイター <span class="pick" id="pick-me">未選択</span>
        <button class="icon-btn" data-toggle="g-me" style="margin-left:auto;font-size:12px">全表示</button></div>
      <input type="text" class="search" data-for="g-me" placeholder="検索…">
      <div class="grid" id="g-me"></div>
    </div>
    <div class="card">
      <div class="label">相手のファイター <span class="pick" id="pick-vs">未選択</span>
        <button class="icon-btn" data-toggle="g-vs" style="margin-left:auto;font-size:12px">全表示</button></div>
      <input type="text" class="search" data-for="g-vs" placeholder="検索…">
      <div class="grid" id="g-vs"></div>
    </div>
    <div class="card">
      <div class="label">勝敗</div>
      <div class="wl">
        <button class="w" id="btn-win">勝ち</button>
        <button class="l" id="btn-lose">負け</button>
      </div>
    </div>
    <div class="card">
      <div class="label">メモ（タイトルになります）</div>
      <input type="text" id="match-memo" placeholder="例：着地狩りされ続けた。下B多め">
    </div>
    <div class="card">
      <div class="label">直近の送信</div>
      <div class="log" id="log-match">まだありません</div>
    </div>
  </section>

  <!-- メモ -->
  <section id="view-memo" class="hide">
    <div class="card">
      <div class="label">メモ</div>
      <textarea id="memo-text" placeholder="思いついたことをそのまま"></textarea>
      <div class="label" style="margin-top:12px">日付</div>
      <input type="date" id="memo-date">
    </div>
    <div class="card">
      <div class="label">直近の送信</div>
      <div class="log" id="log-memo">まだありません</div>
    </div>
  </section>
</main>

<div class="send"><button id="submit">送信</button></div>
<div class="toast" id="toast"></div>

<script src="fighters.js"></script>
<script>
const $ = s => document.querySelector(s);
const LS = {
  get: (k,d) => { try { return JSON.parse(localStorage.getItem('sl_'+k)) ?? d } catch(e){ return d } },
  set: (k,v) => localStorage.setItem('sl_'+k, JSON.stringify(v))
};
let mode = 'match';
const FLIST = [...window.FIGHTERS].sort((a,b) => a.name.localeCompare(b.name, 'ja'));
let sel = { me: LS.get('lastMe', null), vs: null, wl: null };

/* ---- タイル生成 ---- */
function buildGrid(id, key){
  const g = $('#'+id);
  g.innerHTML = '';
  FLIST.forEach(f => {
    const b = document.createElement('div');
    b.className = 'tile';
    b.dataset.id = f.id; b.dataset.name = f.name;
    b.innerHTML = (f.icon ? `<img src="${f.icon}" alt="">` : '') + f.name;
    b.onclick = () => {
      sel[key] = f;
      g.querySelectorAll('.tile').forEach(t => t.classList.toggle('sel', t.dataset.id === f.id));
      $(key === 'me' ? '#pick-me' : '#pick-vs').textContent = f.name;
      if (key === 'me') LS.set('lastMe', f);
      refresh();
    };
    if (sel[key] && sel[key].id === f.id) { b.classList.add('sel'); }
    g.appendChild(b);
  });
  if (sel[key]) $(key === 'me' ? '#pick-me' : '#pick-vs').textContent = sel[key].name;
}
buildGrid('g-me','me'); buildGrid('g-vs','vs');

document.querySelectorAll('.search').forEach(inp => {
  inp.oninput = () => {
    const q = inp.value.trim();
    $('#'+inp.dataset.for).querySelectorAll('.tile').forEach(t => {
      t.style.display = !q || t.dataset.name.includes(q) ? '' : 'none';
    });
  };
});
document.querySelectorAll('[data-toggle]').forEach(b => {
  b.onclick = () => $('#'+b.dataset.toggle).classList.toggle('open');
});

/* ---- 勝敗 ---- */
$('#btn-win').onclick  = () => { sel.wl = '勝ち'; paintWL(); };
$('#btn-lose').onclick = () => { sel.wl = '負け'; paintWL(); };
function paintWL(){
  $('#btn-win').classList.toggle('on', sel.wl === '勝ち');
  $('#btn-lose').classList.toggle('on', sel.wl === '負け');
  refresh();
}

/* ---- タブ / 設定 ---- */
function show(v){
  mode = v;
  $('#view-match').classList.toggle('hide', v !== 'match');
  $('#view-memo').classList.toggle('hide', v !== 'memo');
  $('#view-cfg').classList.toggle('hide', v !== 'cfg');
  $('#tab-match').classList.toggle('on', v === 'match');
  $('#tab-memo').classList.toggle('on', v === 'memo');
  $('.send').style.display = v === 'cfg' ? 'none' : '';
  refresh();
}
$('#tab-match').onclick = () => show('match');
$('#tab-memo').onclick  = () => show('memo');
$('#gear').onclick = () => show(mode === 'cfg' ? 'match' : 'cfg');

$('#cfg-url').value = LS.get('url','');
$('#cfg-token').value = LS.get('token','');
$('#cfg-url').oninput = e => LS.set('url', e.target.value.trim());
$('#cfg-token').oninput = e => LS.set('token', e.target.value);
$('#memo-date').value = new Date().toLocaleDateString('sv-SE');
$('#match-memo').oninput = refresh;
$('#memo-text').oninput = refresh;

/* ---- 送信可否 ---- */
function refresh(){
  const ok = mode === 'match'
    ? !!(sel.me && sel.vs && sel.wl)
    : !!$('#memo-text').value.trim();
  $('#submit').disabled = !ok;
  $('#submit').textContent = mode === 'match'
    ? (sel.me && sel.vs ? `送信（${sel.me.name} vs ${sel.vs.name}${sel.wl ? ' / '+sel.wl : ''}）` : '自分・相手・勝敗を選んでください')
    : '送信';
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function addLog(id, line){
  const el = $('#'+id);
  if (el.textContent === 'まだありません') el.textContent = '';
  el.insertAdjacentHTML('afterbegin', line + '<br>');
}

/* ---- 送信 ---- */
$('#submit').onclick = async () => {
  const url = LS.get('url',''), token = LS.get('token','');
  if (!url) { toast('⚙ から Worker の URL を設定してください'); return; }
  const body = mode === 'match'
    ? { type:'match', memo: $('#match-memo').value.trim(), result: sel.wl, meId: sel.me.id, vsId: sel.vs.id }
    : { type:'memo',  memo: $('#memo-text').value.trim(),  date: $('#memo-date').value };
  const btn = $('#submit'); const old = btn.textContent;
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    const r = await fetch(url.replace(/\/$/,'') + '/log', {
      method:'POST', headers:{'Content-Type':'application/json','X-App-Token':token},
      body: JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    const now = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    if (mode === 'match') {
      addLog('log-match', `${now} ${sel.me.name} vs ${sel.vs.name} — ${sel.wl}${body.memo ? ' / '+body.memo : ''}`);
      // 自分のキャラと勝敗の入力状態だけリセット（連戦を想定して自分は保持）
      $('#match-memo').value = ''; sel.wl = null; paintWL();
    } else {
      addLog('log-memo', `${now} ${body.memo.slice(0,40)}`);
      $('#memo-text').value = '';
    }
    toast('✅ Notionに追加しました');
  } catch (e) {
    toast('⚠ 失敗：' + e.message);
  } finally {
    btn.textContent = old; refresh();
  }
};
refresh();
</script>
</body>
</html>
